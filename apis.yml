aid: hummingbot
name: Hummingbot
description: >-
  Hummingbot is an open source Python framework, maintained by the Hummingbot
  Foundation, that lets traders build and run automated, high-frequency crypto
  trading strategies across both centralized (CEX) and decentralized (DEX)
  venues. The project ships several developer-facing components: the Hummingbot
  client (a CLI trading bot), Gateway (a TypeScript middleware that standardizes
  DEX/blockchain endpoints behind one REST API on port 15888, documented with a
  published OpenAPI spec), the Hummingbot API (a FastAPI REST server on port
  8000 that orchestrates multiple bots, accounts, portfolios, and market data),
  an async Python API client, an official Model Context Protocol (MCP) server,
  and a set of open Agent Skills for AI trading agents. With 300+ exchange
  connectors and Apache-2.0 licensing, Hummingbot reports having facilitated
  tens of billions of dollars in trade volume across 100K+ deployed instances.
