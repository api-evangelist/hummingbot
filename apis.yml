apis:
- name: Hummingbot API
  description: >-
    The Hummingbot API is a FastAPI backend service (default port 8000) that orchestrates multiple trading
    bots and exposes REST routers for accounts and exchange credentials, trading (orders, positions, trades,
    leverage), portfolio state and valuation, connectors and trading rules, market data (candles, prices,
    order books, funding), bot orchestration, controllers, and scripts. Interactive Swagger docs are served
    at /docs; authentication is HTTP Basic. An official async Python client (hummingbot-api-client) wraps
    it.
  humanURL: https://hummingbot.org/hummingbot-api/
  baseURL: http://localhost:8000
  properties:
  - type: Documentation
    url: https://hummingbot.org/hummingbot-api/
  - type: APIReference
