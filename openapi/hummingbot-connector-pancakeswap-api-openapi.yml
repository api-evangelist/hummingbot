                - quoteTokenAmount
                - baseTokenAmountMax
                - quoteTokenAmountMax
  /connectors/pancakeswap/clmm/quote-swap:
    get:
      tags:
      - /connector/pancakeswap
      description: Get swap quote for Pancakeswap V3 CLMM
      parameters:
      - schema:
          type: string
          default: bsc
        example: bsc
        in: query
        name: network
        required: false
      - schema:
          type: string
        in: query
        name: poolAddress
        required: false
        description: Pool address (optional - can be looked up from baseToken and quoteToken)
      - schema:
          type: string
        example: USDT
        in: query
        name: baseToken
        required: true
      - schema:
          type: string
        example: WBNB
        in: query
        name: quoteToken
        required: false
      - schema:
          type: number
        example: 10
        in: query
        name: amount
        required: true
      - schema:
          type: string
          enum:
          - BUY
          - SELL
        example: SELL
        in: query
        name: side
        required: true
      - schema:
          type: number
        example: 1
        in: query
        name: slippagePct
        required: false
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  poolAddress:
                    type: string
                  tokenIn:
                    type: string
                  tokenOut:
                    type: string
                  amountIn:
                    type: number
                  amountOut:
                    type: number
                  price:
                    type: number
                  slippagePct:
                    type: number
                  minAmountOut:
                    type: number
                  maxAmountIn:
                    type: number
                  priceImpactPct:
                    type: number
                required:
                - poolAddress
